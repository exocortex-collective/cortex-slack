[project]
name = "cortex-slack"
version = "0.1.0"
description = "Slack archive ingest for Cortex: polling now, push later, one ingest seam"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cortex-utils @ git+https://github.com/devonjones/cortex-utils.git@f4d556e",
    "psycopg2-binary>=2.9.0",
    "prometheus-client>=0.16.0",
    "structlog>=24.0.0",
    "boto3>=1.34.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "bandit>=1.7.0",
    "vulture>=2.11",
    "types-psycopg2>=2.9.0",
    "boto3-stubs[s3]>=1.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# cortex-utils is a git dependency pinned to a SHA, as in postmark and gateway.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_slack"]
# The DDL is package data, not a repo-relative file: an installed container has
# no repo. cortex-granola shipped a wheel without its schema by assuming
# otherwise, and the failure only surfaced in the container.
artifacts = ["src/cortex_slack/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py311"
# The reviewer pack teaches by contrast: its "# BAD" python blocks are
# deliberately malformed, and formatting them erases the lesson.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
# cortex-utils ships no py.typed marker, so strict mode cannot see through it.
# Same override as cortex-granola and postmark.
module = "cortex_utils.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/cortex_slack"]

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 80
